[package]
name = "harness-engine"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "harness-engine"
path = "src/bin/harness-engine.rs"

[dependencies]
harness-proto.workspace = true
harness-doc.workspace = true
harness-sync.workspace = true
harness-adapters.workspace = true
harness-rpc.workspace = true
loro.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
uuid.workspace = true
chrono.workspace = true
notify.workspace = true
portable-pty.workspace = true
base64 = "0.22"
libc.workspace = true
gethostname.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
sha2.workspace = true
reqwest.workspace = true
tokio-tungstenite.workspace = true
ignore.workspace = true
nucleo-matcher.workspace = true
# browse Connected apps (browse_link): P-256 ECDSA request signing.
p256 = { version = "0.14", features = ["ecdsa", "getrandom"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# Relay tokens are compared in constant time.
subtle = "2"

tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
mimalloc.workspace = true
# The browse pairing key lives in the login Keychain, not a file.
security-framework = "3"
# Keep-awake holds an IOKit power assertion named by CFStrings.
core-foundation = "0.10"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
# Native Flint (justrach/nanoattention) tokenizer for Apple Silicon macOS.
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
harness-adapters = { workspace = true, features = ["installer-fixture"] }
zip.workspace = true
tokio-tungstenite.workspace = true
# In-process registry server for the two-engine workspace integration tests.
harness-sync = { workspace = true, features = ["mock-server"] }

[[test]]
name = "previews"

[[test]]
name = "show_visual"

[[test]]
name = "show_artifact"
